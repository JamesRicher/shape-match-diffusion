name: faust_matrix_diffusion_wks
group: pre_diffusionnet                 # experiments/<group>/<name>/
model_type: MatrixDiffusionModel
is_train: true
# Fixed-feature experiment: NO learnable extractor. The model reads frozen per-vertex WKS
# descriptors from <data_root>/feats_wks (produced by scripts/compute_spectral_feats.py) as
# its only feature source. Feature ablation at eval (--set diffusion.ablate_features=true)
# then measures how much the denoiser relied on WKS vs the P_t / geodesic pathway.

datasets:
  train: {name: Faust_r, type: SparsePairFaustDataset, phase: train, n_sparse: 512, feats_dir: feats_wks}
  val:   {name: Faust_r, type: SparsePairFaustDataset, phase: test,  n_sparse: 512, exclude_self: true, feats_dir: feats_wks}
  test:  {name: Faust_r, type: SparsePairFaustDataset, phase: test,  n_sparse: 512, exclude_self: true, ret_evecs: true, num_evecs: 200, feats_dir: feats_wks}

networks:
  # No extractor -> frozen features from feats_wks. feat_dim autofilled from the data (= n_e).
  denoiser:
    type: MatrixDenoiser
    feat_dim: null             # auto-filled from the WKS descriptor dim at runtime
    dim: 128
    heads: 4
    depth: 6
    n_anchors: 16
    dropout: 0.0

diffusion:
  eta: 0.1
  proj_iters: 6
  schedule_s: 0.008
  sample_steps: 50
  final_iters: 20
  # ablate_features stays default false for training; set it true only at eval time.

# ZoomOut spectral densifier for reporting-time dense MGE (evaluate.py); never used in training.
densifier:
  type: ZoomOutDensifier
  k_start: 20
  k_step: 10
  k_final: 200                 # must be <= datasets.test.num_evecs

eval:
  sparse: true
  dense: false

train:
  total_epochs: 30
  log_freq: 20
  optims:
    denoiser: {type: AdamW, lr: 1e-3, weight_decay: 1e-4}
  schedulers:
    denoiser: {type: CosineAnnealingLR, eta_min: 1e-4}

val:
  subset: 40
