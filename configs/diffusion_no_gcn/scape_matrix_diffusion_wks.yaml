name: scape_matrix_diffusion_wks
group: pre_diffusionnet                 # experiments/<group>/<name>/
model_type: MatrixDiffusionModel
is_train: true
# Fixed-feature experiment on SCAPE_r in the modern _tw_gt regime, but with NO learnable
# extractor: the only feature source is the frozen per-vertex WKS descriptors in
# <data_root>/feats_wks (scripts/compute_spectral_feats.py). Everything else mirrors
# scape_diffusionnet_512_FMD_snrfd_tw_gt.yaml -- geodesic-gaussian soft target, work-band
# t_sampler, CFG feature dropout -- so the ablation (--set diffusion.ablate_features=true)
# measures how much the denoiser leans on fixed WKS vs the P_t / geodesic pathway.
# feature_dropout kept LOW (0.1): we want a model that mostly uses the features, then see
# what ablation costs -- not a feature-free model.

datasets:
  # No extractor -> no operators needed at train/val, so ret_evecs stays off there (the
  # gaussian target uses geodesic D_x, not the spectrum). Test loads evecs for the densifier.
  train: {name: Scape_r, type: SparsePairScapeDataset, phase: train, n_sparse: 512, exclude_self: true, fps_metric: euclidean, feats_dir: feats_wks}
  val:   {name: Scape_r, type: SparsePairScapeDataset, phase: test,  n_sparse: 512, exclude_self: true, fps_metric: euclidean, feats_dir: feats_wks}
  test:  {name: Scape_r, type: SparsePairScapeDataset, phase: test,  n_sparse: 512, exclude_self: true, fps_metric: euclidean, ret_evecs: true, num_evecs: 200, feats_dir: feats_wks}

networks:
  # No extractor -> frozen WKS features. feat_dim autofilled from the data (= n_e = 100).
  denoiser:
    type: MatrixDenoiser
    feat_dim: null
    dim: 128
    heads: 4
    depth: 6
    n_anchors: 16
    dropout: 0.0

diffusion:
  eta: 0.1
  proj_iters: 6
  schedule_s: 0.008
  logsnr_shift: 0.0      # plain cosine: the gaussian target already centers the work band
  feature_dropout: 0.1   # LOW CFG dropout -- mostly feature-driven, ablation then measures the cost
  t_sampler:             # per-regime work-band t (loss onset measured by loss_vs_t_draws)
    t_min_drop: 0.35
    t_min_feat: 0.6
    uniform_frac: 0.1
  target:
    type: gaussian       # geodesic soft target around the GT match (u0 + CE weights); l_ce logged as KL
    sigma: 0.03          # kernel width, sqrt-area units; SCAPE 512-anchor NN spacing ~0.038
    cutoff: 0.09         # 3*sigma; kernel drops to `floor` beyond this distance
    floor: 2.0e-4        # tail mass relative to unit peak
  sample_steps: 50
  final_iters: 20

# FunctionalMap densifier for reporting-time dense MGE; feat_source wks (no diffnet extractor).
densifier:
  type: FunctionalMapDensifier
  feat_source: wks
  k_fm: 120
  n_e: 100
  lm_bands: 20
  lm_weight: 5.0
  mu: 0.1
  variance: 7.0

eval:
  sparse: true
  dense: false

train:
  total_epochs: 60
  log_freq: 20
  optims:
    denoiser: {type: AdamW, lr: 1e-3, weight_decay: 1e-4}
  schedulers:
    denoiser: {type: CosineAnnealingLR, eta_min: 1e-4}

val:
  subset: 40
