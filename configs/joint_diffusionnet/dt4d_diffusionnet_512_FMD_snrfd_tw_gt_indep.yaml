# DT4D_r _tw_gt + HONEST INDEPENDENT-FPS TRAINING (variant A). Identical to
# dt4d_diffusionnet_512_FMD_snrfd_tw_gt.yaml except train.independent_train_prob=1.0 and
# feature_dropout 0.5 -> 0.3. Each train step FPS-samples source and target sparse points
# INDEPENDENTLY over each shape's GT-covered vertices (the test regime), not the bijective
# correspondence; the gaussian geodesic target keeps full supervision (every query is covered ->
# its source image is known, via the composed cross-corr for inter pairs -> soft target is a
# geodesic kernel over the non-corresponding source anchors). See faust _indep header for the
# full rationale. Inter-class corr composition happens BEFORE sparsify, so the independent-train
# path consumes the composed maps exactly like FAUST.
#
# !! BLOCKED ON CACHES: DT4D_r ships only off/ + corres/. This needs the dist/ (geodesic),
#    feats/ and evecs/ caches generated first (item loading fails otherwise). Also pretrain the
#    extractor FIRST, same as the base config:
#      python pretrain_diffusionnet.py -c fe_configs/diffusion_net/dt4d_diffusionnet_hks.yaml --num_workers 8
name: dt4d_diffusionnet_512_FMD_snrfd_tw_gt_indep
group: diffusionnet                 # experiments/<group>/<name>/
model_type: MatrixDiffusionModel
is_train: true

path:
  resume_state: extractor_experiments/diffusion_net/dt4d_diffusionnet_hks/models/best.pth
  resume: false

datasets:
  # combined pools (ULRSSM): intra with exclude_self; inter has no diagonal by construction
  train:
    - {name: Dt4d_r, type: SparsePairDT4DDataset, phase: train, inter_class: false, n_sparse: 512, exclude_self: true, fps_metric: euclidean, ret_evecs: true, num_evecs: 128}
    - {name: Dt4d_r, type: SparsePairDT4DDataset, phase: train, inter_class: true,  n_sparse: 512, fps_metric: euclidean, ret_evecs: true, num_evecs: 128}
  val:   {name: Dt4d_r, type: SparsePairDT4DDataset, phase: test, inter_class: true, n_sparse: 512, fps_metric: euclidean, ret_evecs: true, num_evecs: 128}
  test:  {name: Dt4d_r, type: SparsePairDT4DDataset, phase: test, inter_class: true, n_sparse: 512, ret_evecs: true, num_evecs: 200, fps_metric: euclidean}

networks:
  extractor:
    type: DiffusionNetExtractor
    out_dim: 128
    input_type: hks
    hidden: 128
    n_block: 4
    k_eig: 128
    hks_count: 16
  denoiser:
    type: MatrixDenoiser
    feat_dim: 128
    dim: 128
    heads: 4
    depth: 6
    n_anchors: 16
    dropout: 0.0

diffusion:
  eta: 0.1
  proj_iters: 6
  schedule_s: 0.008
  logsnr_shift: 0.0
  feature_dropout: 0.3   # lowered from 0.5 for independent-FPS training (diffuse dropped-step target)
  t_sampler:
    t_min_drop: 0.35
    t_min_feat: 0.6
    uniform_frac: 0.1
  target:
    type: gaussian       # REQUIRED for independent-FPS training (asserted in _target)
    sigma: 0.03
    cutoff: 0.09
    floor: 2.0e-4
  sample_steps: 50
  final_iters: 20

densifier:
  type: FunctionalMapDensifier
  feat_source: diffnet
  k_fm: 120
  n_e: 100
  lm_bands: 20
  lm_weight: 5.0
  mu: 0.1
  variance: 7.0

eval:
  sparse: true
  dense: false

train:
  # combined pool = 8702 pairs/epoch; 22 epochs ~ FAUST's 30 x ~6300 total-step budget
  total_epochs: 22
  log_freq: 20
  independent_train_prob: 1.0   # (A) full honest independent-FPS training; 0 = bijective (default)
  optims:
    extractor: {type: AdamW, lr: 1e-4, weight_decay: 1e-4}
    denoiser:  {type: AdamW, lr: 1e-3, weight_decay: 1e-4}
  schedulers:
    extractor: {type: CosineAnnealingLR, eta_min: 1e-5}
    denoiser:  {type: CosineAnnealingLR, eta_min: 1e-4}

val:
  subset: 40
