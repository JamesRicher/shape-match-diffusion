# FAUST _tw + GEODESIC-GAUSSIAN training target: identical to
# faust_diffusionnet_512_FMD_snrfd_tw.yaml except diffusion.target switches the one-hot
# permutation target to a soft target ∝ exp(-d_geo²/2σ²) around the GT match, floored past
# the cutoff (utils.sinkhorn.gaussian_target). Puts a metric on the label space the row-CE
# lacks: near-misses get cheap, far misses stay expensive. Used for both the clean logits u0
# and the CE weights; the logged l_ce is the KL (entropy floor subtracted), so loss curves
# stay comparable with the onehot runs. Judge on sparse avg_error / dense MGE, NOT exact-match
# acc (soft targets deliberately tolerate near-misses). Pretrain the extractor FIRST (see the
# _snrfd header).
name: faust_diffusionnet_512_FMD_snrfd_tw_gt
group: diffusionnet                 # experiments/<group>/<name>/
model_type: MatrixDiffusionModel
is_train: true

path:
  resume_state: extractor_experiments/diffusion_net/faust_diffusionnet_hks/models/best.pth
  resume: false

datasets:
  train: {name: Faust_r, type: SparsePairFaustDataset, phase: train, n_sparse: 512, exclude_self: true, fps_metric: euclidean, ret_evecs: true, num_evecs: 128}
  val:   {name: Faust_r, type: SparsePairFaustDataset, phase: test,  n_sparse: 512, exclude_self: true, fps_metric: euclidean, ret_evecs: true, num_evecs: 128}
  test:  {name: Faust_r, type: SparsePairFaustDataset, phase: test,  n_sparse: 512, exclude_self: true, ret_evecs: true, num_evecs: 200, fps_metric: euclidean}

networks:
  extractor:
    type: DiffusionNetExtractor
    out_dim: 128
    input_type: hks
    hidden: 128
    n_block: 4
    k_eig: 128
    hks_count: 16
  denoiser:
    type: MatrixDenoiser
    feat_dim: 128
    dim: 128
    heads: 4
    depth: 6
    n_anchors: 16
    dropout: 0.0

diffusion:
  eta: 0.1
  proj_iters: 6
  schedule_s: 0.008
  logsnr_shift: 0.0      # plain cosine: the gaussian target's lower logit range already puts the
                         # GT-survival crossover at t~0.55 at b=0 (gt_survival_sweep on THIS config);
                         # keeping -1.75 would double-apply the correction (crossover drops to 0.29)
  feature_dropout: 0.5   # CFG-style conditioning dropout; raised from 0.2 -- see header
  t_sampler:             # per-regime work-band t (loss onset measured by loss_vs_t_draws)
    t_min_drop: 0.35     # feature-dropped steps: loss nonzero above ~0.4
    t_min_feat: 0.6      # features-on steps: only residual signal is near t=1
    uniform_frac: 0.1    # floor: keep 10% of steps full-range so low-t denoising never atrophies
  target:
    type: gaussian       # geodesic soft target (default onehot = original behaviour)
    sigma: 0.03          # kernel width, sqrt-area units; measured 512-anchor NN spacing ~0.038
                         # -> GT + its ~4 geodesic neighbours hold ~82% of target mass
    cutoff: 0.09         # 3*sigma; kernel drops to `floor` beyond this distance
    floor: 2.0e-4        # tail mass (relative to unit peak); ~floor*512 ≈ 0.1 = eta's budget
  sample_steps: 50
  final_iters: 20

densifier:
  type: FunctionalMapDensifier
  feat_source: diffnet   # dense global data term from the trained DiffusionNet extractor (falls back to WKS if absent)
  k_fm: 120
  n_e: 100
  lm_bands: 20
  lm_weight: 5.0
  mu: 0.1
  variance: 7.0

eval:
  sparse: true
  dense: false

train:
  total_epochs: 30
  log_freq: 20
  optims:
    # warm-started extractor: gentle fine-tune (10x lower LR); denoiser trains from scratch
    extractor: {type: AdamW, lr: 1e-4, weight_decay: 1e-4}
    denoiser:  {type: AdamW, lr: 1e-3, weight_decay: 1e-4}
  schedulers:
    extractor: {type: CosineAnnealingLR, eta_min: 1e-5}
    denoiser:  {type: CosineAnnealingLR, eta_min: 1e-4}

val:
  subset: 40
