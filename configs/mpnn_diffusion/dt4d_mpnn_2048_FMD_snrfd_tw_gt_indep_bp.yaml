# dt4d_mpnn_2048_FMD_snrfd_tw_gt_indep_bp: the DT4D BP recipe at 4x the 512 sparse resolution.
# Third point on the resolution axis (512 -> 1024 -> 2048), BP held fixed, so the comparison
# against dt4d_mpnn_1024_FMD_snrfd_tw_gt_indep_bp isolates n_sparse.
#
# WHY. The coincidence gap -- distance from a query's GT image to the nearest source anchor
# under independent FPS -- is the irreducible floor on sparse error, and it falls as n^-1/2.
# At 512 it is ~3x LARGER than the sparse error BP already achieves, so BP's accuracy is being
# quantised away by the anchor set. 2048 cuts the gap ~2x versus 512.
#
# COUPLED KNOBS (spacing ~ n^-1/2, so everything defined relative to spacing moves with it):
#   target.sigma  0.030 -> 0.015   0.03 * sqrt(512/2048). VERIFIED, not extrapolated: DT4D's own
#                                  GT-survival band is t@50% = 0.55 at (512, sigma 0.030), and
#                                  0.51 at (2048, sigma 0.015) -- inside the sweep's grid
#                                  resolution. sigma 0.0165 gave 0.45, clearly too low.
#                                  (diagnostics/gt_survival_sweep.py)
#   target.cutoff 0.090 -> 0.045   3*sigma, as before
#   target.floor  2e-4  -> 5e-5    holds the tail budget floor*n_sparse = 0.1
#   k_intra       12    -> 24      12*sqrt(4): same geodesic radius per hop at 4x density
#   bp.n_sweeps   3     -> 6       3*sqrt(4): restores BP's propagation distance
#   logsnr_shift  0.0   -> 0.0     UNCHANGED: the sigma rescale alone realigns the schedule
#
# RISK -- READ BEFORE TRUSTING A NEGATIVE RESULT. The bijective sparse GT caps at ~3166 points
# for INTER pairs (the cross-category composition stacks a second many-to-one map on the .vts),
# so n_sparse=2048 is ~65% of cap, past the ~50% where the constraint starts to bite: the
# bijective FPS spread ratio falls to ~0.90, i.e. anchors are measurably more clustered than
# free FPS would place them, and biased AWAY from the detail regions the filter rejects. Intra
# is comfortable (~40% of its ~5173 cap). If this run underperforms 1024, that bias is the first
# suspect, not resolution -- check by rerunning with the inter pool alone at 1024 vs 2048.
#
# COST. State is n^2, so ~4x the 1024 run per step and ~16x the 512 run. Validation densifies
# every pair under independent FPS; subset is kept at 60 for comparability with the 1024 runs,
# but this is the first knob to cut if val dominates the epoch.
name: dt4d_mpnn_2048_FMD_snrfd_tw_gt_indep_bp
group: mpnn_diffusion               # experiments/<group>/<name>/
model_type: MPNNDiffusionModel
is_train: true

path:
  resume_state: extractor_experiments/diffusion_net/dt4d_diffusionnet_hks/models/best.pth
  resume: false

datasets:
  # combined pools (ULRSSM): intra with exclude_self; inter has no diagonal by construction
  train:
    - {name: Dt4d_r, type: SparsePairDT4DDataset, phase: train, inter_class: false, n_sparse: 2048, exclude_self: true, fps_metric: euclidean, ret_evecs: true, num_evecs: 128}
    - {name: Dt4d_r, type: SparsePairDT4DDataset, phase: train, inter_class: true,  n_sparse: 2048, fps_metric: euclidean, ret_evecs: true, num_evecs: 128}
  val:   # BOTH regimes, mirroring train: inter-only val ignored half the training distribution
    - {name: Dt4d_r, type: SparsePairDT4DDataset, phase: test, inter_class: false, n_sparse: 2048, exclude_self: true, fps_metric: euclidean, ret_evecs: true, num_evecs: 128}
    - {name: Dt4d_r, type: SparsePairDT4DDataset, phase: test, inter_class: true,  n_sparse: 2048, fps_metric: euclidean, ret_evecs: true, num_evecs: 128}
  test:  {name: Dt4d_r, type: SparsePairDT4DDataset, phase: test, inter_class: true, n_sparse: 2048, ret_evecs: true, num_evecs: 200, fps_metric: euclidean}

networks:
  extractor:
    type: DiffusionNetExtractor
    out_dim: 128
    input_type: hks
    hidden: 128
    n_block: 4
    k_eig: 128
    hks_count: 16
  denoiser:
    type: MPNNMatrixDenoiser
    feat_dim: 128
    dim: 128
    depth: 6
    heads: 4              # cross-attention heads (used only when cross_type=attn)
    cross_type: mpnn      # candidate-graph GNN cross stage (feature-kNN ∪ state top-k)
    k_intra: 24           # 12*sqrt(4) at 4x density: same geodesic radius per hop
    k_feat: 10            # static feature-kNN candidates per receiver (cross)
    k_state: 10           # dynamic state-top-k candidates per receiver (cross)
    n_rbf: 16             # RBF basis size (distance + state-value filters)
    rbf_max: 3.0          # upper end of the normalised-distance RBF grid
    inner_iters: 3        # soft-Sinkhorn sweeps in the per-block re-gauge
    dropout: 0.0

    bp:                     # belief propagation in the loop (notes/BP-loop-design.md)
      k_logit: 10           # candidate set: top-k of the current state ...
      k_feat: 10            #   ... union feature-kNN (static, cached per forward)
      k_graph: null         # null = reuse the trunk's k_intra geodesic graph
      sigma: 0.05           # isometric-distortion tolerance, NOT a spacing -> does not scale with n
      delta: 4.0            # potential truncation, outlier robustness
      tau: 1.0              # 1 = sum-product
      alpha: 0.5            # damping (fixed, not learned)
      slack: -4.0           # abstention score for unproposed matches
      at_block: 1           # BP runs ONCE per forward (= per DDIM step), at this trunk block
      n_sweeps: 8           # train-time inference effort; override at eval
      beta_init: 0.5        # unary scale at init; beta(t) learned from the spine
      beta_min: 0.1         # bounds on beta -- both ends of its range destroy the mixing
      beta_max: 4.0         #   of evidence, and the old softplus reached 0.000 and 9.6
      g_scale: 4.0          # fixed multiplier on the zero-init output gate
      bidirectional: true   # 1/2(D_Y + D_X^T) -> exact pair-swap symmetry
      cycle_gate: false     # OFF: learned v was ~0, so the gate acted only as an off-switch
      checkpoint: false     # one call, not six: ~6x less activation memory to trade away

diffusion:
  eta: 0.0               # inert under the gaussian target (see _target); pinned for parity
  proj_iters: 6
  schedule_s: 0.008
  logsnr_shift: 0.0
  feature_dropout: 0.3   # lowered from 0.5 for independent-FPS training (diffuse dropped-step target)
  t_sampler:
    t_min_drop: 0.35
    t_min_feat: 0.6
    uniform_frac: 0.1
  target:
    type: gaussian       # REQUIRED for independent-FPS training (asserted in _target)
    sigma: 0.015         # 0.03 * sqrt(512/2048); holds the survival band (gt_survival_sweep)
    cutoff: 0.045        # 3*sigma
    floor: 5.0e-5        # holds the tail budget floor*n_sparse = 0.1
  sample_steps: 50
  final_iters: 20

densifier:
  type: FunctionalMapDensifier
  feat_source: diffnet
  k_fm: 120
  n_e: 100
  lm_bands: 20
  lm_weight: 5.0
  mu: 0.1
  variance: 7.0

eval:
  sparse: true
  dense: false

train:
  total_epochs: 22
  log_freq: 20
  independent_train_prob: 1.0   # (A) full honest independent-FPS training; 0 = bijective (default)
  optims:
    extractor: {type: AdamW, lr: 1e-4, weight_decay: 1e-4}
    denoiser:  {type: AdamW, lr: 1e-3, weight_decay: 1e-4}
  schedulers:
    extractor: {type: CosineAnnealingLR, eta_min: 1e-5}
    denoiser:  {type: CosineAnnealingLR, eta_min: 1e-4}

val:
  subset: 60
  independent_fps: true     # validate in the inference regime (no GT in FPS selection).
                            # Forces eval.sparse=false / eval.dense=true in train.py: the
                            # sparse diagonal error/acc are undefined without gt_perm, so the
                            # reported dev number becomes dense MGE through the densifier.
