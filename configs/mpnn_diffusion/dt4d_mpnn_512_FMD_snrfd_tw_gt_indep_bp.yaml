# dt4d_mpnn_512_FMD_snrfd_tw_gt_indep_bp: dt4d_mpnn_512_FMD_snrfd_tw_gt_indep + in-loop belief propagation
# (notes/BP-loop-design.md). FROM SCRATCH: identical recipe to the parent config —
# same extractor init, epochs and LRs — with the BP subsystem enabled, so the parent
# run is the matched no-BP control. BP's output gate g is zero-init, so training
# starts as the parent architecture and BP fades in.
# Baseline to beat is NOT the parent alone but the parent + fixed post-process BP
# (diagnostics/bp_postprocess_sweep.py at the tuned scalars).
#
name: dt4d_mpnn_512_FMD_snrfd_tw_gt_indep_bp
group: mpnn_diffusion               # experiments/<group>/<name>/
model_type: MPNNDiffusionModel
is_train: true

path:
  resume_state: extractor_experiments/diffusion_net/dt4d_diffusionnet_hks/models/best.pth
  resume: false

datasets:
  # combined pools (ULRSSM): intra with exclude_self; inter has no diagonal by construction
  train:
    - {name: Dt4d_r, type: SparsePairDT4DDataset, phase: train, inter_class: false, n_sparse: 512, exclude_self: true, fps_metric: euclidean, ret_evecs: true, num_evecs: 128}
    - {name: Dt4d_r, type: SparsePairDT4DDataset, phase: train, inter_class: true,  n_sparse: 512, fps_metric: euclidean, ret_evecs: true, num_evecs: 128}
  val:   {name: Dt4d_r, type: SparsePairDT4DDataset, phase: test, inter_class: true, n_sparse: 512, fps_metric: euclidean, ret_evecs: true, num_evecs: 128}
  test:  {name: Dt4d_r, type: SparsePairDT4DDataset, phase: test, inter_class: true, n_sparse: 512, ret_evecs: true, num_evecs: 200, fps_metric: euclidean}

networks:
  extractor:
    type: DiffusionNetExtractor
    out_dim: 128
    input_type: hks
    hidden: 128
    n_block: 4
    k_eig: 128
    hks_count: 16
  denoiser:
    type: MPNNMatrixDenoiser
    feat_dim: 128
    dim: 128
    depth: 6
    heads: 4              # cross-attention heads (used only when cross_type=attn)
    cross_type: mpnn      # candidate-graph GNN cross stage (feature-kNN ∪ state top-k)
    k_intra: 12           # geodesic-kNN degree for the intra message-passing graph
    k_feat: 10            # static feature-kNN candidates per receiver (cross)
    k_state: 10           # dynamic state-top-k candidates per receiver (cross)
    n_rbf: 16             # RBF basis size (distance + state-value filters)
    rbf_max: 3.0          # upper end of the normalised-distance RBF grid
    inner_iters: 3        # soft-Sinkhorn sweeps in the per-block re-gauge
    dropout: 0.0

    bp:                     # belief propagation in the loop (notes/BP-loop-design.md)
      k_logit: 10           # candidate set: top-k of the current state ...
      k_feat: 10            #   ... union feature-kNN (static, cached per forward)
      k_graph: null         # null = reuse the trunk's k_intra geodesic graph
      sigma: 0.05           # isometric-distortion tolerance (bp_sigma_calibration.py)
      delta: 4.0            # potential truncation, outlier robustness
      tau: 1.0              # 1 = sum-product
      alpha: 0.5            # damping (fixed, not learned)
      slack: -4.0           # abstention score for unproposed matches
      n_sweeps: 3           # train-time inference effort; override at eval
      beta_init: 0.5        # unary scale at init; beta(t) learned from the spine
      g_scale: 4.0          # fixed multiplier on the zero-init output gate
      bidirectional: true   # 1/2(D_Y + D_X^T) -> exact pair-swap symmetry
      cycle_gate: true      # per-vertex round-trip agreement gate (d=1)
      track_decay: 1.0      # rho on the u_bp accumulator; 1 = full exclusion
      checkpoint: true      # recompute BP sweeps in backward (activation memory)

diffusion:
  eta: 0.1
  proj_iters: 6
  schedule_s: 0.008
  logsnr_shift: 0.0
  feature_dropout: 0.3   # lowered from 0.5 for independent-FPS training (diffuse dropped-step target)
  t_sampler:
    t_min_drop: 0.35
    t_min_feat: 0.6
    uniform_frac: 0.1
  target:
    type: gaussian       # REQUIRED for independent-FPS training (asserted in _target)
    sigma: 0.03
    cutoff: 0.09
    floor: 2.0e-4
  sample_steps: 50
  final_iters: 20

densifier:
  type: FunctionalMapDensifier
  feat_source: diffnet
  k_fm: 120
  n_e: 100
  lm_bands: 20
  lm_weight: 5.0
  mu: 0.1
  variance: 7.0

eval:
  sparse: true
  dense: false

train:
  # combined pool = 8702 pairs/epoch; 22 epochs ~ FAUST's 30 x ~6300 total-step budget
  total_epochs: 22
  log_freq: 20
  independent_train_prob: 1.0   # (A) full honest independent-FPS training; 0 = bijective (default)
  optims:
    extractor: {type: AdamW, lr: 1e-4, weight_decay: 1e-4}
    denoiser:  {type: AdamW, lr: 1e-3, weight_decay: 1e-4}
  schedulers:
    extractor: {type: CosineAnnealingLR, eta_min: 1e-5}
    denoiser:  {type: CosineAnnealingLR, eta_min: 1e-4}

val:
  subset: 20                # halved: independent-FPS val densifies every pair (see below)
  independent_fps: true     # validate in the inference regime (no GT in FPS selection).
                            # Forces eval.sparse=false / eval.dense=true in train.py: the
                            # sparse diagonal error/acc are undefined without gt_perm, so the
                            # reported dev number becomes dense MGE through the densifier.
