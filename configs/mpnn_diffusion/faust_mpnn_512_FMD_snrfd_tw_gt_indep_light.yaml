# FAUST — LIGHTWEIGHT MPNN variant of faust_mpnn_512_FMD_snrfd_tw_gt_indep.yaml.
# Same recipe + cross_type=mpnn, but cheaper denoiser for faster/lighter iteration:
#   depth 6->4, mlp_ratio 4->2 (smaller FFN), inner_iters 3->2, n_rbf 16->8,
#   k_intra 12->8, k_feat/k_state 10->8. ~2x faster, ~40% fewer params.
# NOT apples-to-apples with the transformer (different width/depth) — use the non-light
# config for the clean MPNN-vs-transformer comparison; this one is for fast turnaround.
name: faust_mpnn_512_FMD_snrfd_tw_gt_indep_light
group: mpnn_diffusion               # experiments/<group>/<name>/
model_type: MPNNDiffusionModel
is_train: true

path:
  resume_state: extractor_experiments/diffusion_net/faust_diffusionnet_hks/models/best.pth
  resume: false

datasets:
  train: {name: Faust_r, type: SparsePairFaustDataset, phase: train, n_sparse: 512, exclude_self: true, fps_metric: euclidean, ret_evecs: true, num_evecs: 128}
  val:   {name: Faust_r, type: SparsePairFaustDataset, phase: test,  n_sparse: 512, exclude_self: true, fps_metric: euclidean, ret_evecs: true, num_evecs: 128}
  test:  {name: Faust_r, type: SparsePairFaustDataset, phase: test,  n_sparse: 512, exclude_self: true, ret_evecs: true, num_evecs: 200, fps_metric: euclidean}

networks:
  extractor:
    type: DiffusionNetExtractor
    out_dim: 128
    input_type: hks
    hidden: 128
    n_block: 4
    k_eig: 128
    hks_count: 16
  denoiser:
    type: MPNNMatrixDenoiser
    feat_dim: 128
    dim: 128
    depth: 4              # (2) lighter trunk (was 6)
    heads: 4              # cross-attention heads (used only when cross_type=attn)
    cross_type: mpnn      # candidate-graph GNN cross stage (feature-kNN ∪ state top-k)
    mlp_ratio: 2.0        # (3) smaller FFN sublayer (was 4.0)
    k_intra: 8            # (5) fewer geodesic neighbours (was 12)
    k_feat: 8             # (5) fewer feature candidates (was 10)
    k_state: 8            # (5) fewer state candidates (was 10)
    n_rbf: 8              # (4) smaller RBF basis -> lighter dense state tensors (was 16)
    rbf_max: 3.0          # upper end of the normalised-distance RBF grid
    inner_iters: 2        # (4) fewer soft-Sinkhorn sweeps per block (was 3)
    dropout: 0.0

diffusion:
  eta: 0.1
  proj_iters: 6
  schedule_s: 0.008
  logsnr_shift: 0.0
  feature_dropout: 0.3   # lowered from 0.5 for independent-FPS training (diffuse dropped-step target)
  t_sampler:
    t_min_drop: 0.35
    t_min_feat: 0.6
    uniform_frac: 0.1
  target:
    type: gaussian       # REQUIRED for independent-FPS training (asserted in _target)
    sigma: 0.03
    cutoff: 0.09
    floor: 2.0e-4
  sample_steps: 50
  final_iters: 20

densifier:
  type: FunctionalMapDensifier
  feat_source: diffnet
  k_fm: 120
  n_e: 100
  lm_bands: 20
  lm_weight: 5.0
  mu: 0.1
  variance: 7.0

eval:
  sparse: true
  dense: false

train:
  total_epochs: 30
  log_freq: 20
  independent_train_prob: 1.0   # (A) full honest independent-FPS training; 0 = bijective (default)
  optims:
    extractor: {type: AdamW, lr: 1e-4, weight_decay: 1e-4}
    denoiser:  {type: AdamW, lr: 1e-3, weight_decay: 1e-4}
  schedulers:
    extractor: {type: CosineAnnealingLR, eta_min: 1e-5}
    denoiser:  {type: CosineAnnealingLR, eta_min: 1e-4}

val:
  subset: 40
