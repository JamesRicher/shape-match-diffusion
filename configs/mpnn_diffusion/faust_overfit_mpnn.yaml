# MPNN-denoiser go/no-go gate: overfit ONE fixed FAUST_r pair, cross_type=mpnn.
# Run with:  python train.py -c configs/mpnn_diffusion/faust_overfit_mpnn.yaml
#
# Mirror of configs/diffusion_no_gcn/faust_overfit.yaml with the MPNN denoiser +
# its model twin. Expected if the machinery is sound: l_ce -> ~0, sparse acc -> ~1.0.
# The attn cross variant is the closer cousin of the validated transformer, so it
# gates the intra-MPNN + state track in isolation; the mpnn cross variant config
# alongside this one gates the candidate-graph exchange on top.

name: mpnn_diffusion_overfit_mpnn
group: mpnn_diffusion                   # experiments/<group>/<name>/
model_type: MPNNDiffusionModel
is_train: true

datasets:
  train: {name: Faust_r, type: SparsePairFaustDataset, phase: test, n_sparse: 256, exclude_self: true}
  val:   {name: Faust_r, type: SparsePairFaustDataset, phase: test, n_sparse: 256, exclude_self: true}
  test:  {name: Faust_r, type: SparsePairFaustDataset, phase: test, n_sparse: 256, exclude_self: true}

networks:
  denoiser:
    type: MPNNMatrixDenoiser
    feat_dim: null             # auto-filled from the data at runtime
    dim: 128
    depth: 5
    heads: 4
    cross_type: mpnn           # A/B switch: attn | mpnn
    k_intra: 12
    k_feat: 10                 # mpnn cross only (ignored under attn)
    k_state: 10                # mpnn cross only (ignored under attn)
    n_rbf: 16
    inner_iters: 3
    dropout: 0.0

diffusion:
  eta: 0.1
  proj_iters: 6
  schedule_s: 0.008
  sample_steps: 50
  final_iters: 20

diagnostics:
  loss_vs_t: true
  divergence: true
  bins: 10
  repeats: 16
  samples: 8

train:
  total_epochs: 3
  log_freq: 50
  subset: 1                    # overfit a single fixed pair
  repeat: 500
  optims:
    denoiser: {type: AdamW, lr: 1e-3, weight_decay: 0.0}
  schedulers:
    denoiser: {type: CosineAnnealingLR, eta_min: 1e-4}

val:
  subset: 1
