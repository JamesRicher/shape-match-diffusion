# scape_mpnn_1024_FMD_snrfd_tw_gt_indep_bp: the n_sparse=512 recipe at DOUBLE sparse resolution. Adds in-loop belief propagation
# (notes/BP-loop-design.md); the no-BP twin of this file is the matched control. BP's output gate
# is zero-init, so training starts as the parent architecture and BP fades in.
#
# WHY. Under independent FPS a query's GT image does not coincide with any source anchor; that
# coincidence gap (~0.45 x anchor spacing) is the irreducible floor on sparse error, and at 512 it
# is already ~3x LARGER than the sparse error BP achieves -- so accuracy is being poured into a
# container too coarse to hold it. Spacing goes as n^-1/2, so 1024 cuts the gap ~30%
# (FAUST 0.0190 -> 0.0126 sqrt-area units).
#
# COUPLED KNOBS -- n_sparse alone is NOT a valid change. Everything defined relative to anchor
# spacing must move with it:
#   target.sigma  0.030 -> 0.021   keeps ~4 anchors inside the kernel AND holds the GT-survival
#                                  work band at t~0.55 (diagnostics/gt_survival_sweep.py). Leaving
#                                  sigma at 0.030 collapses it to t~0.32 and puts the t_sampler
#                                  bands in the region where the GT is already destroyed.
#   target.cutoff 0.090 -> 0.063   3*sigma, as before
#   target.floor  2e-4  -> 1e-4    holds the tail budget floor*n = 0.1
#   k_intra       12    -> 16      12*sqrt(2): same geodesic radius per hop at 2x density
#   logsnr_shift  0.0   -> 0.0     UNCHANGED: the sigma rescale alone realigns the schedule
#
# Matched to the 512 run in epochs, LRs, schedulers and extractor init, so resolution (plus the
# knobs it forces) is the only variable.
name: scape_mpnn_1024_FMD_snrfd_tw_gt_indep_bp
group: mpnn_diffusion               # experiments/<group>/<name>/
model_type: MPNNDiffusionModel
is_train: true

path:
  resume_state: extractor_experiments/diffusion_net/scape_diffusionnet_hks/models/best.pth
  resume: false

datasets:
  train: {name: Scape_r, type: SparsePairScapeDataset, phase: train, n_sparse: 1024, exclude_self: true, fps_metric: euclidean, ret_evecs: true, num_evecs: 128}
  val:   {name: Scape_r, type: SparsePairScapeDataset, phase: test,  n_sparse: 1024, exclude_self: true, fps_metric: euclidean, ret_evecs: true, num_evecs: 128}
  test:  {name: Scape_r, type: SparsePairScapeDataset, phase: test,  n_sparse: 1024, exclude_self: true, ret_evecs: true, num_evecs: 200, fps_metric: euclidean}

networks:
  extractor:
    type: DiffusionNetExtractor
    out_dim: 128
    input_type: hks
    hidden: 128
    n_block: 4
    k_eig: 128
    hks_count: 16
  denoiser:
    type: MPNNMatrixDenoiser
    feat_dim: 128
    dim: 128
    depth: 6
    heads: 4              # cross-attention heads (used only when cross_type=attn)
    cross_type: mpnn      # candidate-graph GNN cross stage (feature-kNN ∪ state top-k)
    k_intra: 16           # 12*sqrt(2) at 2x density: same geodesic radius per hop
    k_feat: 10            # static feature-kNN candidates per receiver (cross)
    k_state: 10           # dynamic state-top-k candidates per receiver (cross)
    n_rbf: 16             # RBF basis size (distance + state-value filters)
    rbf_max: 3.0          # upper end of the normalised-distance RBF grid
    inner_iters: 3        # soft-Sinkhorn sweeps in the per-block re-gauge
    dropout: 0.0

    bp:                     # belief propagation in the loop (notes/BP-loop-design.md)
      k_logit: 10           # candidate set: top-k of the current state ...
      k_feat: 10            #   ... union feature-kNN (static, cached per forward)
      k_graph: null         # null = reuse the trunk's k_intra geodesic graph
      sigma: 0.05           # isometric-distortion tolerance, NOT a spacing -> does not scale with n
      delta: 4.0            # potential truncation, outlier robustness
      tau: 1.0              # 1 = sum-product
      alpha: 0.5            # damping (fixed, not learned)
      slack: -4.0           # abstention score for unproposed matches
      n_sweeps: 5           # 3*sqrt(2): restores propagation distance at 2x density
      beta_init: 0.5        # unary scale at init; beta(t) learned from the spine
      g_scale: 4.0          # fixed multiplier on the zero-init output gate
      bidirectional: true   # 1/2(D_Y + D_X^T) -> exact pair-swap symmetry
      cycle_gate: true      # per-vertex round-trip agreement gate (d=1)
      track_decay: 1.0      # rho on the u_bp accumulator; 1 = full exclusion
      checkpoint: true      # recompute BP sweeps in backward (activation memory)

diffusion:
  eta: 0.0               # inert under the gaussian target (see _target); pinned for parity
  proj_iters: 6
  schedule_s: 0.008
  logsnr_shift: 0.0
  feature_dropout: 0.3   # lowered from 0.5 for independent-FPS training (diffuse dropped-step target)
  t_sampler:
    t_min_drop: 0.35
    t_min_feat: 0.6
    uniform_frac: 0.1
  target:
    type: gaussian       # REQUIRED for independent-FPS training (asserted in _target)
    sigma: 0.021         # 0.03 * sqrt(512/1024); holds the survival band (gt_survival_sweep)
    cutoff: 0.063        # 3*sigma
    floor: 1.0e-4        # holds the tail budget floor*n_sparse = 0.1
  sample_steps: 50
  final_iters: 20

densifier:
  type: FunctionalMapDensifier
  feat_source: diffnet
  k_fm: 120
  n_e: 100
  lm_bands: 20
  lm_weight: 5.0
  mu: 0.1
  variance: 7.0

eval:
  sparse: true
  dense: false

train:
  total_epochs: 60
  log_freq: 20
  independent_train_prob: 1.0   # (A) full honest independent-FPS training; 0 = bijective (default)
  optims:
    extractor: {type: AdamW, lr: 1e-4, weight_decay: 1e-4}
    denoiser:  {type: AdamW, lr: 1e-3, weight_decay: 1e-4}
  schedulers:
    extractor: {type: CosineAnnealingLR, eta_min: 1e-5}
    denoiser:  {type: CosineAnnealingLR, eta_min: 1e-4}

val:
  subset: 60
