# SCAPE — MPNN denoiser twin of configs/joint_diffusionnet/scape_diffusionnet_512_FMD_snrfd_tw_gt_indep.yaml.
# IDENTICAL training recipe; ONLY the denoiser (geodesic MPNN + state track, cross_type=mpnn) and its
# model twin differ. See the transformer config's header for the recipe rationale.
name: scape_mpnn_512_FMD_snrfd_tw_gt_indep
group: mpnn_diffusion               # experiments/<group>/<name>/
model_type: MPNNDiffusionModel
is_train: true

path:
  resume_state: extractor_experiments/diffusion_net/scape_diffusionnet_hks/models/best.pth
  resume: false

datasets:
  train: {name: Scape_r, type: SparsePairScapeDataset, phase: train, n_sparse: 512, exclude_self: true, fps_metric: euclidean, ret_evecs: true, num_evecs: 128}
  val:   {name: Scape_r, type: SparsePairScapeDataset, phase: test,  n_sparse: 512, exclude_self: true, fps_metric: euclidean, ret_evecs: true, num_evecs: 128}
  test:  {name: Scape_r, type: SparsePairScapeDataset, phase: test,  n_sparse: 512, exclude_self: true, ret_evecs: true, num_evecs: 200, fps_metric: euclidean}

networks:
  extractor:
    type: DiffusionNetExtractor
    out_dim: 128
    input_type: hks
    hidden: 128
    n_block: 4
    k_eig: 128
    hks_count: 16
  denoiser:
    type: MPNNMatrixDenoiser
    feat_dim: 128
    dim: 128
    depth: 6
    heads: 4              # cross-attention heads (used only when cross_type=attn)
    cross_type: mpnn      # candidate-graph GNN cross stage (feature-kNN ∪ state top-k)
    k_intra: 12           # geodesic-kNN degree for the intra message-passing graph
    k_feat: 10            # static feature-kNN candidates per receiver (cross)
    k_state: 10           # dynamic state-top-k candidates per receiver (cross)
    n_rbf: 16             # RBF basis size (distance + state-value filters)
    rbf_max: 3.0          # upper end of the normalised-distance RBF grid
    inner_iters: 3        # soft-Sinkhorn sweeps in the per-block re-gauge
    dropout: 0.0

diffusion:
  eta: 0.1
  proj_iters: 6
  schedule_s: 0.008
  logsnr_shift: 0.0
  feature_dropout: 0.3   # lowered from 0.5 for independent-FPS training (diffuse dropped-step target)
  t_sampler:
    t_min_drop: 0.35
    t_min_feat: 0.6
    uniform_frac: 0.1
  target:
    type: gaussian       # REQUIRED for independent-FPS training (asserted in _target)
    sigma: 0.03
    cutoff: 0.09
    floor: 2.0e-4
  sample_steps: 50
  final_iters: 20

densifier:
  type: FunctionalMapDensifier
  feat_source: diffnet
  k_fm: 120
  n_e: 100
  lm_bands: 20
  lm_weight: 5.0
  mu: 0.1
  variance: 7.0

eval:
  sparse: true
  dense: false

train:
  total_epochs: 60
  log_freq: 20
  independent_train_prob: 1.0   # (A) full honest independent-FPS training; 0 = bijective (default)
  optims:
    extractor: {type: AdamW, lr: 1e-4, weight_decay: 1e-4}
    denoiser:  {type: AdamW, lr: 1e-3, weight_decay: 1e-4}
  schedulers:
    extractor: {type: CosineAnnealingLR, eta_min: 1e-5}
    denoiser:  {type: CosineAnnealingLR, eta_min: 1e-4}

val:
  subset: 40
