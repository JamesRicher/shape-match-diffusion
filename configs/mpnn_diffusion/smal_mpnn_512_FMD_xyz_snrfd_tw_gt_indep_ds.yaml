# smal_mpnn_512_FMD_xyz_snrfd_tw_gt_indep_ds: DS-target clean variant of the ..._indep_bp recipe.
# Derived from smal_mpnn_512_FMD_xyz_snrfd_tw_gt_indep_bp.yaml with THREE changes:
#   * BP subsystem removed (no in-loop belief propagation)
#   * feature_dropout: 0.0  (was 0.3)
#   * diffusion.target.doubly_stochastic: true -> Sinkhorn/entropic-OT target so the clean
#     target lives in the same Birkhoff polytope as the read-in Pi_S (sigma = OT temperature).
# See notes/2026-08-17_entropic_ot_doubly_stochastic_target.md. Row-stochastic control =
# same file with doubly_stochastic omitted/false.
name: smal_mpnn_512_FMD_xyz_snrfd_tw_gt_indep_ds
group: mpnn_diffusion               # experiments/<group>/<name>/
model_type: MPNNDiffusionModel
is_train: true

path:
  resume_state: extractor_experiments/diffusion_net/smal_diffusionnet_xyz/models/best.pth
  resume: false

datasets:
  train: {name: Smal_r, type: SparsePairSmalDataset, phase: train, n_sparse: 512, exclude_self: true, category: true, fps_metric: euclidean, ret_evecs: true, num_evecs: 128}
  val:   {name: Smal_r, type: SparsePairSmalDataset, phase: test,  n_sparse: 512, exclude_self: true, category: true, fps_metric: euclidean, ret_evecs: true, num_evecs: 128}
  test:  {name: Smal_r, type: SparsePairSmalDataset, phase: test,  n_sparse: 512, exclude_self: true, category: true, ret_evecs: true, num_evecs: 200, fps_metric: euclidean}

networks:
  extractor:
    type: DiffusionNetExtractor
    out_dim: 128
    input_type: xyz
    rot_aug: [0, 180, 0]   # must match the pretrain config: the warm start learned yaw-invariance
    hidden: 128
    n_block: 4
    k_eig: 128
  denoiser:
    type: MPNNMatrixDenoiser
    feat_dim: 128
    dim: 128
    depth: 6
    heads: 4              # cross-attention heads (used only when cross_type=attn)
    cross_type: mpnn      # candidate-graph GNN cross stage (feature-kNN ∪ state top-k)
    k_intra: 12           # geodesic-kNN degree for the intra message-passing graph
    k_feat: 10            # static feature-kNN candidates per receiver (cross)
    k_state: 10           # dynamic state-top-k candidates per receiver (cross)
    n_rbf: 16             # RBF basis size (distance + state-value filters)
    rbf_max: 3.0          # upper end of the normalised-distance RBF grid
    inner_iters: 3        # soft-Sinkhorn sweeps in the per-block re-gauge
    dropout: 0.0
    # no bp: block -> BP disabled

diffusion:
  eta: 0.0
  proj_iters: 6
  schedule_s: 0.008
  logsnr_shift: 0.0
  feature_dropout: 0.0   # OFF for this variant
  t_sampler:
    t_min_drop: 0.35
    t_min_feat: 0.35
    uniform_frac: 0.15
  target:
    type: gaussian       # REQUIRED for independent-FPS training (asserted in _target)
    sigma: 0.03
    cutoff: 0.09
    floor: 2.0e-4
    doubly_stochastic: true   # entropic-OT (Sinkhorn) target vs row-stochastic baseline
    ds_iters: 20              # Sinkhorn iterations for the target normalisation
  sample_steps: 50
  final_iters: 20

densifier:
  type: FunctionalMapDensifier
  feat_source: diffnet
  k_fm: 120
  n_e: 100
  lm_bands: 20
  lm_weight: 5.0
  mu: 0.1
  variance: 7.0

eval:
  sparse: true
  dense: false

train:
  total_epochs: 75
  log_freq: 20
  independent_train_prob: 1.0   # (A) full honest independent-FPS training; 0 = bijective (default)
  optims:
    extractor: {type: AdamW, lr: 1e-4, weight_decay: 1e-4}
    denoiser:  {type: AdamW, lr: 1e-3, weight_decay: 1e-4}
  schedulers:
    extractor: {type: CosineAnnealingLR, eta_min: 1e-5}
    denoiser:  {type: CosineAnnealingLR, eta_min: 1e-4}

val:
  subset: 40
