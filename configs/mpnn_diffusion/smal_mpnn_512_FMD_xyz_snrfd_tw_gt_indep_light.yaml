# SMAL xyz — LIGHTWEIGHT MPNN variant of smal_mpnn_512_FMD_xyz_snrfd_tw_gt_indep.yaml.
# Same recipe (incl. xyz extractor + rot_aug) + cross_type=mpnn, cheaper denoiser:
# depth 6->4, mlp_ratio 4->2, inner_iters 3->2, n_rbf 16->8, k_intra 12->8,
# k_feat/k_state 10->8. For fast turnaround; use the non-light config for the clean
# transformer comparison. (SMAL is the longest run at 180 epochs, so it benefits most.)
name: smal_mpnn_512_FMD_xyz_snrfd_tw_gt_indep_light
group: mpnn_diffusion               # experiments/<group>/<name>/
model_type: MPNNDiffusionModel
is_train: true

path:
  resume_state: extractor_experiments/diffusion_net/smal_diffusionnet_xyz/models/best.pth
  resume: false

datasets:
  train: {name: Smal_r, type: SparsePairSmalDataset, phase: train, n_sparse: 512, exclude_self: true, category: true, fps_metric: euclidean, ret_evecs: true, num_evecs: 128}
  val:   {name: Smal_r, type: SparsePairSmalDataset, phase: test,  n_sparse: 512, exclude_self: true, category: true, fps_metric: euclidean, ret_evecs: true, num_evecs: 128}
  test:  {name: Smal_r, type: SparsePairSmalDataset, phase: test,  n_sparse: 512, exclude_self: true, category: true, ret_evecs: true, num_evecs: 200, fps_metric: euclidean}

networks:
  extractor:
    type: DiffusionNetExtractor
    out_dim: 128
    input_type: xyz
    rot_aug: [0, 180, 0]   # must match the pretrain config: the warm start learned yaw-invariance
    hidden: 128
    n_block: 4
    k_eig: 128
  denoiser:
    type: MPNNMatrixDenoiser
    feat_dim: 128
    dim: 128
    depth: 4              # (2) lighter trunk (was 6)
    heads: 4              # cross-attention heads (used only when cross_type=attn)
    cross_type: mpnn      # candidate-graph GNN cross stage (feature-kNN ∪ state top-k)
    mlp_ratio: 2.0        # (3) smaller FFN sublayer (was 4.0)
    k_intra: 8            # (5) fewer geodesic neighbours (was 12)
    k_feat: 8             # (5) fewer feature candidates (was 10)
    k_state: 8            # (5) fewer state candidates (was 10)
    n_rbf: 8              # (4) smaller RBF basis -> lighter dense state tensors (was 16)
    rbf_max: 3.0          # upper end of the normalised-distance RBF grid
    inner_iters: 2        # (4) fewer soft-Sinkhorn sweeps per block (was 3)
    dropout: 0.0

diffusion:
  eta: 0.1
  proj_iters: 6
  schedule_s: 0.008
  logsnr_shift: 0.0
  feature_dropout: 0.3   # lowered from 0.5 for independent-FPS training (diffuse dropped-step target)
  t_sampler:
    t_min_drop: 0.35
    t_min_feat: 0.6
    uniform_frac: 0.1
  target:
    type: gaussian       # REQUIRED for independent-FPS training (asserted in _target)
    sigma: 0.03
    cutoff: 0.09
    floor: 2.0e-4
  sample_steps: 50
  final_iters: 20

densifier:
  type: FunctionalMapDensifier
  feat_source: diffnet
  k_fm: 120
  n_e: 100
  lm_bands: 20
  lm_weight: 5.0
  mu: 0.1
  variance: 7.0

eval:
  sparse: true
  dense: false

train:
  total_epochs: 180
  log_freq: 20
  independent_train_prob: 1.0   # (A) full honest independent-FPS training; 0 = bijective (default)
  optims:
    extractor: {type: AdamW, lr: 1e-4, weight_decay: 1e-4}
    denoiser:  {type: AdamW, lr: 1e-3, weight_decay: 1e-4}
  schedulers:
    extractor: {type: CosineAnnealingLR, eta_min: 1e-5}
    denoiser:  {type: CosineAnnealingLR, eta_min: 1e-4}

val:
  subset: 20                # halved: independent-FPS val densifies every pair (see below)
  independent_fps: true     # validate in the inference regime (no GT in FPS selection).
                            # Forces eval.sparse=false / eval.dense=true in train.py: the
                            # sparse diagonal error/acc are undefined without gt_perm, so the
                            # reported dev number becomes dense MGE through the densifier.
