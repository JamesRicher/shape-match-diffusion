# dt4d_mpnn_512_ds_geo_bp1: BP placement arm 2 of 3 -- EARLY (evidence).
#
# Every non-BP setting is copied verbatim from
# configs/mpnn_diffusion/dt4d_mpnn_512_FMD_snrfd_tw_gt_indep_ds_geo.yaml, so the three
# penultimate/ arms differ from each other in at_block and seed ONLY, and from their _ds_geo
# parent in the bp block ONLY. The parent's trained checkpoint is the matched no-BP control.
#
# THE QUESTION. At block 1 BP's write reaches the tokens through rewarp, so the trunk
# reasons WITH BP's belief for five more blocks -- BP as EVIDENCE rather than as a
# corrector. The cost is that five later StateWrite residuals may overwrite it, and the
# unary BP reads here is the least well gauged in the trunk. This was the previous default
# (at_block 1), so the arm doubles as a measurement of what the gauge fix bought: compare
# against the stale dt4d_mpnn_512_FMD_snrfd_tw_gt_indep_bp1_s0 run, which trained with BP
# reading an ungauged u. The contrast arm is bp5 (CORRECTOR); bp5_s1 is the seed repeat
# that says whether any gap between them is real.
#
# DECISION RULE, fixed in advance: compare |bp5 - bp1| against |bp5 - bp5_s1|. If the
# placement gap is inside the seed gap, placement does not matter -- take the fixed
# post-process and drop in-loop BP from the headline.
#
# Baseline to beat is NOT the parent alone but the parent + post-process BP
# (diagnostics/bp_postprocess_eval.py at the tuned scalars). Run that first; it costs
# minutes on the existing checkpoint and sets the bar these three have to clear.
#
# NOTE: the bp block requires the gauge fix (BP reads a re-gauged u, networks/mpnn/denoiser.py).
# Checkpoints from before it are not comparable to these runs.
name: dt4d_mpnn_512_ds_geo_bp1
group: penultimate                  # experiments/<group>/<name>/
model_type: MPNNDiffusionModel
is_train: true
seed: 0                             # explicit: the parent sets none, and the seed repeat
                                    # arm is only meaningful against a pinned baseline seed

path:
  resume_state: extractor_experiments/diffusion_net/dt4d_diffusionnet_hks/models/best.pth
  resume: false

datasets:
  # combined pools (ULRSSM): intra with exclude_self; inter has no diagonal by construction
  train:
    - {name: Dt4d_r, type: SparsePairDT4DDataset, phase: train, inter_class: false, n_sparse: 512, exclude_self: true, fps_metric: geodesic, ret_evecs: true, num_evecs: 128}
    - {name: Dt4d_r, type: SparsePairDT4DDataset, phase: train, inter_class: true,  n_sparse: 512, fps_metric: geodesic, ret_evecs: true, num_evecs: 128}
  val:   {name: Dt4d_r, type: SparsePairDT4DDataset, phase: test, inter_class: true, n_sparse: 512, fps_metric: geodesic, ret_evecs: true, num_evecs: 128}
  test:  {name: Dt4d_r, type: SparsePairDT4DDataset, phase: test, inter_class: true, n_sparse: 512, ret_evecs: true, num_evecs: 200, fps_metric: geodesic}

networks:
  extractor:
    type: DiffusionNetExtractor
    out_dim: 128
    input_type: hks
    hidden: 128
    n_block: 4
    k_eig: 128
    hks_count: 16
  denoiser:
    type: MPNNMatrixDenoiser
    feat_dim: 128
    dim: 128
    depth: 6
    heads: 4              # cross-attention heads (used only when cross_type=attn)
    cross_type: mpnn      # candidate-graph GNN cross stage (feature-kNN ∪ state top-k)
    k_intra: 12           # geodesic-kNN degree for the intra message-passing graph
    k_feat: 10            # static feature-kNN candidates per receiver (cross)
    k_state: 10           # dynamic state-top-k candidates per receiver (cross)
    n_rbf: 16             # RBF basis size (distance + state-value filters)
    rbf_max: 3.0          # upper end of the normalised-distance RBF grid
    inner_iters: 3        # soft-Sinkhorn sweeps in the per-block re-gauge
    dropout: 0.0
    bp:                     # belief propagation in the loop (notes/BP-loop-design.md)
      k_logit: 10           # candidate set: top-k of the current state ...
      k_feat: 10            #   ... union feature-kNN (static, cached per forward)
      k_graph: null         # null = reuse the trunk's k_intra geodesic graph
      sigma: 0.05           # isometric-distortion tolerance (bp_sigma_calibration.py)
      delta: 4.0            # potential truncation, outlier robustness
      tau: 1.0              # 1 = sum-product
      alpha: 0.5            # damping (fixed, not learned)
      slack: -4.0           # abstention score for unproposed matches
      at_block: 1           # THE ARM. Second block of the depth-6 trunk: BP's write reaches
                            #   the tokens through rewarp and the remaining blocks consume it,
                            #   but five later StateWrite residuals can overwrite it --
                            #   evidence, not corrector. Contrast with the bp5 arm.
      n_sweeps: 8           # train-time inference effort; override at eval. Raised 3 -> 8:
                            #   one call at 8 sweeps is still ~1/2 the BP cost of six at 3.
      beta_init: 0.5        # unary scale at init; beta(t) learned from the spine
      beta_min: 0.1         # bounds on beta -- BOTH ends of its range destroy the mixing
      beta_max: 4.0         #   of evidence, and the old softplus reached 0.000 and 9.6
      g_scale: 4.0          # fixed multiplier on the zero-init output gate
      bidirectional: true   # 1/2(D_Y + D_X^T) -> exact pair-swap symmetry, no gate needed
      cycle_gate: false     # OFF: learned v was ~0 in 44/48 blocks, so the round-trip
                            #   signal was never used -- the gate's bias was an off-switch
      checkpoint: false     # one call, not six: ~6x less activation memory to trade away

diffusion:
  eta: 0.0
  proj_iters: 6
  schedule_s: 0.008
  logsnr_shift: 0.0
  feature_dropout: 0.0   # OFF for this variant
  t_sampler:
    t_min_drop: 0.35
    t_min_feat: 0.35
    uniform_frac: 0.15
  target:
    type: gaussian       # REQUIRED for independent-FPS training (asserted in _target)
    sigma: 0.03
    cutoff: 0.09
    floor: 2.0e-4
    doubly_stochastic: true   # entropic-OT (Sinkhorn) target vs row-stochastic baseline
    ds_iters: 20              # Sinkhorn iterations for the target normalisation
  sample_steps: 50
  final_iters: 20

densifier:
  type: FunctionalMapDensifier
  feat_source: diffnet
  k_fm: 120
  n_e: 100
  lm_bands: 20
  lm_weight: 5.0
  mu: 0.1
  variance: 7.0

eval:
  sparse: true
  dense: false

train:
  # combined pool = 8702 pairs/epoch; 14 epochs ~ FAUST's total-step budget
  total_epochs: 14
  log_freq: 20
  independent_train_prob: 1.0   # (A) full honest independent-FPS training; 0 = bijective (default)
  optims:
    extractor: {type: AdamW, lr: 1e-4, weight_decay: 1e-4}
    denoiser:  {type: AdamW, lr: 1e-3, weight_decay: 1e-4}
  schedulers:
    extractor: {type: CosineAnnealingLR, eta_min: 1e-5}
    denoiser:  {type: CosineAnnealingLR, eta_min: 1e-4}

val:
  subset: 20                # halved: independent-FPS val densifies every pair (see below)
  independent_fps: true     # validate in the inference regime (no GT in FPS selection).
                            # Forces eval.sparse=false / eval.dense=true in train.py: the
                            # sparse diagonal error/acc are undefined without gt_perm, so the
                            # reported dev number becomes dense MGE through the densifier.
