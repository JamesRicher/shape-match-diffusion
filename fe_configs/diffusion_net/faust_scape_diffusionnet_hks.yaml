# Joint FAUST+SCAPE DiffusionNet pretraining, INTRINSIC (HKS) input.
# MIXED DATASET: `train`/`val` are LISTS of dataset dicts -> pretrain_diffusionnet.py
# concatenates them (ConcatDataset) and the DataLoader shuffles the two together. Entries
# MUST share n_sparse and network-relevant params. See pretrain_diffusionnet._build_phase.
# Feeds the joint model configs/joint_diffusionnet/faust_scape_diffusionnet_512_FMD.yaml --
# point that config's resume_state at this run's best.pth and keep the extractor arch identical.
#   python pretrain_diffusionnet.py -c fe_configs/diffusion_net/faust_scape_diffusionnet_hks.yaml --num_workers 8

name: faust_scape_diffusionnet_hks      # run dir = extractor_experiments/diffusion_net/<name>/

datasets:
  # ret_evecs: true REQUIRED (num_evecs >= network.k_eig). HKS is intrinsic, so fps_metric
  # matters less, but keep euclidean to match the joint-model regime.
  train:
    - {name: Faust_r, type: SparsePairFaustDataset, phase: train, n_sparse: 256, fps_metric: euclidean, ret_evecs: true, num_evecs: 128}
    - {name: Scape_r, type: SparsePairScapeDataset, phase: train, n_sparse: 256, fps_metric: euclidean, ret_evecs: true, num_evecs: 128}
  val:
    - {name: Faust_r, type: SparsePairFaustDataset, phase: test, n_sparse: 256, exclude_self: true, fps_metric: euclidean, ret_evecs: true, num_evecs: 128}
    - {name: Scape_r, type: SparsePairScapeDataset, phase: test, n_sparse: 256, exclude_self: true, fps_metric: euclidean, ret_evecs: true, num_evecs: 128}

network:
  type: DiffusionNetExtractor
  out_dim: 128
  input_type: hks         # intrinsic HKS descriptors (transferable, symmetry-ambiguous)
  hidden: 128
  n_block: 4
  k_eig: 128              # <= datasets.*.num_evecs
  hks_count: 16           # number of HKS bands fed in

train:
  epochs: 25
  lr: 1.0e-3
  weight_decay: 1.0e-4
  tau: 0.07               # InfoNCE temperature
  num_workers: 4          # pin_memory off (collate ships sparse gradX/gradY)
  eval_limit: 40          # val pairs scored each epoch (null = all)
